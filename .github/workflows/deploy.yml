name: Deploy Frontend

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: [self-hosted, main]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: yhfmg/deboard-frontend:latest
          cache-from: type=registry,ref=yhfmg/deboard-frontend:buildcache
          cache-to: type=registry,ref=yhfmg/deboard-frontend:buildcache,mode=max

      - name: Deploy
        run: |
          cd /home/myh7754/deboard
          docker pull yhfmg/deboard-frontend:latest
          docker compose up -d --no-deps frontend
          docker image prune -f
